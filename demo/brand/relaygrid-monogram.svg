<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="rgBg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#rgBg)" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="4"/>
  <!-- Subtle 3x3 optical grid cells -->
  <g stroke="#334155" stroke-width="2" opacity="0.55">
    <rect x="44" y="44" width="50" height="50" rx="10"/>
    <rect x="103" y="44" width="50" height="50" rx="10"/>
    <rect x="162" y="44" width="50" height="50" rx="10"/>
    <rect x="44" y="103" width="50" height="50" rx="10"/>
    <rect x="103" y="103" width="50" height="50" rx="10"/>
    <rect x="162" y="103" width="50" height="50" rx="10"/>
    <rect x="44" y="162" width="50" height="50" rx="10"/>
    <rect x="103" y="162" width="50" height="50" rx="10"/>
    <rect x="162" y="162" width="50" height="50" rx="10"/>
  </g>
  <!-- Laser Beam Path (Amber -> Splitter -> Emerald) -->
  <path d="M69 69H187" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M187 69V187H128" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Mirror 1 (Top Right \) -->
  <line x1="173" y1="55" x2="201" y2="83" stroke="#FBBF24" stroke-width="10" stroke-linecap="round"/>
  <!-- Mirror 2 (Bottom Right /) -->
  <line x1="173" y1="201" x2="201" y2="173" stroke="#34D399" stroke-width="10" stroke-linecap="round"/>
  <!-- Amber Emitter -->
  <circle cx="69" cy="69" r="14" fill="#F59E0B"/>
  <circle cx="69" cy="69" r="22" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="3"/>
  <!-- Emerald Target Node -->
  <circle cx="128" cy="187" r="10" fill="#10B981"/>
  <circle cx="128" cy="187" r="20" stroke="#10B981" stroke-width="4.5"/>
</svg>
